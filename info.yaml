# Tiny Tapeout project information
project:
  title:        "4-Input Perceptron"
  author:       "Ahmed Hamed"
  discord:      ""
  description:  "A hardware implementation of a 4-input perceptron neural network."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_".
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "x1"
  ui[1]: "x2"
  ui[2]: "x3"
  ui[3]: "x4"
  ui[4]: "Unused"
  ui[5]: "Unused"
  ui[6]: "Unused"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "Prediction"
  uo[1]: "z bit 0"
  uo[2]: "z bit 1"
  uo[3]: "z bit 2"
  uo[4]: "z bit 3"
  uo[5]: "z bit 4"
  uo[6]: "z bit 5"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
