# Tiny Tapeout project information
project:
  title:        "Tiny Trainable Perceptron"
  author:       "Ahmed Hamed"
  discord:      ""
  description:  "A small trainable 4-input perceptron with on-chip weight updates using the perceptron learning rule."
  language:     "Verilog"
  clock_hz:     0

  # Single Tiny Tapeout tile
  tiles: "1x1"

  # Top-level module
  top_module:  "tt_um_example"

  # Source files
  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "Input x1"
  ui[1]: "Input x2"
  ui[2]: "Input x3"
  ui[3]: "Input x4"
  ui[4]: "Target"
  ui[5]: "Train Enable"
  ui[6]: "Echo Enable"
  ui[7]: "Unused"

  # Outputs
  uo[0]: "Prediction"
  uo[1]: "z bit 0"
  uo[2]: "z bit 1"
  uo[3]: "z bit 2"
  uo[4]: "z bit 3"
  uo[5]: "z bit 4"
  uo[6]: "z bit 5"
  uo[7]: "Unused"

  # Bidirectional pins
  uio[0]: "Unused"
  uio[1]: "Unused"
  uio[2]: "Unused"
  uio[3]: "Unused"
  uio[4]: "Unused"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
