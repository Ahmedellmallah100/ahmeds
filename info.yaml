# Tiny Tapeout project information
project:
  title:        "Neural Network Accelerator"
  author:       "Ahmed Hamed"
  discord:      ""
  description:  "A small hardware neural network accelerator with multiple layers, ReLU activation, and requantization."
  language:     "Verilog"
  clock_hz:     0

  # Single Tiny Tapeout tile
  tiles: "1x1"

  # Top-level module
  top_module:  "tt_um_nn_accelerator"

  # Source files
  source_files:
    - "tt_um_nn_accelerator.v"
    - "Leyars.v"
    - "Multi_Neuron.v"
    - "Single_Neuron.v"
    - "Neuron.v"
    - "RELU.v"
    - "Requantize.v"
    - "X_RAM.v"
    - "W_ROM.v"
    - "Bias_Rom.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "Input bit 0"
  ui[1]: "Input bit 1"
  ui[2]: "Input bit 2"
  ui[3]: "Input bit 3"
  ui[4]: "Input bit 4"
  ui[5]: "Input bit 5"
  ui[6]: "Input bit 6"
  ui[7]: "Input bit 7"

  # Outputs
  uo[0]: "NN output bit 0"
  uo[1]: "NN output bit 1"
  uo[2]: "NN output bit 2"
  uo[3]: "NN output bit 3"
  uo[4]: "NN output bit 4"
  uo[5]: "NN output bit 5"
  uo[6]: "NN output bit 6"
  uo[7]: "NN output bit 7"

  # Bidirectional pins
  uio[0]: "Inference Done"
  uio[1]: "Input Valid"
  uio[2]: "Input Address bit 0"
  uio[3]: "Input Address bit 1"
  uio[4]: "Input Address bit 2"
  uio[5]: "Unused"
  uio[6]: "Unused"
  uio[7]: "Unused"

# Do not change!
yaml_version: 6
